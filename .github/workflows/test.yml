name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The model-free test suite needs only numpy + soundfile; the heavy
        # runtime deps (torch, pyannote) are exercised locally, not in CI.
        run: |
          python -m pip install --upgrade pip
          pip install numpy soundfile pytest

      - name: Byte-compile every module
        run: python -m compileall -q voxsolo tests

      - name: Run test suite
        run: pytest tests/ -q
