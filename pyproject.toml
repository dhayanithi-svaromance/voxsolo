[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxsolo"
version = "0.1.0"
description = "Speaker diarization, verbatim speaker isolation with overlap silencing, and NLE/DAW timeline exports for filmmakers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dhayanithi A"}
]
keywords = [
    "speaker-diarization", "speaker-isolation", "pyannote",
    "davinci-resolve", "premiere-pro", "audacity", "whisper",
    "film-sound", "audio-post-production", "dialogue-editing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12.1",
    "torch>=2.0",
    "pyannote.audio>=3.1",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
voxsolo = "voxsolo.cli:main"

[project.urls]
Homepage = "https://github.com/dhayanithi-svaromance/voxsolo"
Issues = "https://github.com/dhayanithi-svaromance/voxsolo/issues"

[tool.setuptools]
packages = ["voxsolo"]
